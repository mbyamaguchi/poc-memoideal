<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>memoideal</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="flex-row h-screen w-full">
        <!-- 左側のコンテンツ -->
        <div class="flex-col flex-between w-240 border-r">
            <div class="flex-col flex-start">
                <h1 hidden>memoideal</h1>
                <h2 class="text-lg">アイデア一覧</h2>
                <div id="list" class="text-md flex-col gap-md w-full">
                    <div class="p-sm active">idea1</div>
                    <div class="p-sm">idea2</div>
                </div>
            </div>
            <div class="flex-col flex-center w-full p-lg">
                <button type="button" id="add">追加</button>
            </div>
        </div>
        <!-- 右側のコンテンツ -->
        <div class="flex-col w-full">
            <div class="flex-col h-full p-md">
                <input type="text" id="ideaTitle" class="text-md p-md" disabled />
                <textarea id="ideaBody" class="h-full text-md p-md" disabled></textarea>
            </div>
            <div class="flex-row flex-end gap-lg p-lg">
                <button type="button" id="edit">編集</button>
                <button type="button" id="save">保存</button>
                <button type="button" id="delete">削除</button>
            </div>
        </div>
    </div>

    <script type="module" src="bundle.js" defer></script>
</body>

</html>
